# Descubrimiento de nodos: cada nodo conoce la lista fija del cluster
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-3

# Al montar este archivo se reemplaza el de la imagen: sin esto, guest solo podría entrar desde localhost del contenedor
loopback_users.guest = false

# Si un nodo queda aislado de la mayoría, se pausa en vez de aceptar escrituras divergentes
cluster_partition_handling = pause_minority
